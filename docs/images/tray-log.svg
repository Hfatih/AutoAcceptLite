<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="AutoAccept Lite log window and tray menu">
  <rect width="960" height="430" rx="14" fill="#0b1622"/>

  <!-- Log window -->
  <rect x="24" y="24" width="660" height="382" rx="10" fill="#101e2d" stroke="#24384d"/>
  <rect x="24" y="24" width="660" height="34" rx="10" fill="#182a3d"/>
  <rect x="24" y="46" width="660" height="12" fill="#182a3d"/>
  <rect x="38" y="33" width="16" height="16" rx="4" fill="#000" stroke="#fff"/>
  <path d="M42 41l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#d7e6f2">AutoAccept Lite - Log</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="13">
